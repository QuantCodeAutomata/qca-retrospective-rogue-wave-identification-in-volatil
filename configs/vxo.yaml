# Reviewed configuration. Sample bounds are INCLUSIVE.
# Null bounds use all supplied history; exact source endpoints are not specified.
# The last published PEAK date is not the last observation date; prominence needs later data.
# These thresholds are inherited from the paper, not calibrated to the corrected implementation.
# spectral_peaks is the literal paper interpretation; all_bins is an explicit sensitivity alternative.
# Dirichlet endpoint convention, dt=1 and raw index-point amplitude are declared assumptions.
index: VXO
sample_start: null
sample_end: null
insample_end: '2004-12-31'
filter_mode: spectral_peaks
filter_percentile_descriptive: 92.5
filter_percentile_realtime: 95.0
threshold_lower_extreme: 2.0
threshold_major_rogue: 2.5
window_L: 80
boundary_condition: dirichlet
delta_t: 1.0
block_len: 10
threshold_grad_count: 50.0
threshold_warning: 700.0
detection_window_days: 240
min_inter_peak_days: 80
late_signal_days: 10
